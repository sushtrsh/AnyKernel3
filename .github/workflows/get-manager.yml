name: GetManager
permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: read   # Allows triggering actions

on:
  workflow_call: # This allows this workflow to be called from another workflow
    inputs:
      kernelsu_variant:
        required: true
        type: string
    outputs:
      susVer:
        description: "The fetched SUSFS version number"
        value: ${{ jobs.get_ksu_manager.outputs.susVer }}

      ksuVer:
        description: "The calculated KSU version number"
        value: ${{ jobs.get_ksu_manager.outputs.ksuVer }}

      managerVer:
        description: "Measured version number of the latest official uploaded Manager build"
        value: ${{ jobs.get_ksu_manager.outputs.managerVer }}

      ksuCommit:
        description: "Commit SHA of the latest official uploaded Manager build (used for kernel-side alignment)"
        value: ${{ jobs.get_ksu_manager.outputs.ksuCommit }}

      managerCertSize:
        description: "FinaSU manager signing certificate DER size (0x hex, used to align the kernel's second trust slot)"
        value: ${{ jobs.get_ksu_manager.outputs.managerCertSize }}

      managerCertHash:
        description: "FinaSU manager signing certificate SHA256 (used to align the kernel's second trust slot)"
        value: ${{ jobs.get_ksu_manager.outputs.managerCertHash }}

jobs:
  get_ksu_manager:
    runs-on: ubuntu-latest
    outputs:
      # Output 1: KSU version number
      ksuVer: ${{ steps.get_version.outputs.kversion }}
      # Output 2: SUSFS version number
      susVer: ${{ steps.get_version.outputs.sversion }}
      # Output 3: Manager measured version number
      managerVer: ${{ steps.add_KSU.outputs.managerVer }}
      # Output 4: commit SHA of the latest official uploaded build (used for kernel-side alignment)
      ksuCommit: ${{ steps.add_KSU.outputs.ksuCommit }}
      # Output 5/6: FinaSU manager signing certificate (used to align the kernel's second trust slot)
      managerCertSize: ${{ steps.add_KSU.outputs.managerCertSize }}
      managerCertHash: ${{ steps.add_KSU.outputs.managerCertHash }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out script repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl jq

      - name: Get KSU & SUSFS versions
        id: get_version
        run: |

          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            echo "This is the SukiSU variant"
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "BakaSU" ]; then
            echo "This is the BakaSU variant"
            git clone https://github.com/Baka-SU/BakaSU.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "FinaSU" ]; then
            echo "This is the FinaSU variant"
            git clone https://github.com/LyraVoid/FinaSU.git KernelSU
          else
            echo "Unknown variant"
            exit 1
          fi

          cd KernelSU

          # Calculate the KSU version number
          KSU_GIT_VERSION=$(git rev-list --count HEAD)

          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            KSU_VERSION=$((40000 + KSU_GIT_VERSION - 2815))
          elif [ "${{ inputs.kernelsu_variant }}" == "FinaSU" ]; then
            # FinaSU's kernel Kbuild and manager build.gradle.kts both compute the version as 30000 + git commit count
            KSU_VERSION=$((30000 + KSU_GIT_VERSION))
          else
            KSU_VERSION=$((30700 + KSU_GIT_VERSION))
          fi
          echo $KSU_VERSION
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV

          # Calculate the SUSFS version number
          INFO="https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android14-6.1/ksu_module_susfs/module.prop"
          SUS_VERSION=$(curl -s $INFO | awk -F '=' '$1 == "version" { print $2 }')
          echo $SUS_VERSION

          # Export these two values for the release
          echo "kversion=$KSU_VERSION" >> $GITHUB_OUTPUT
          echo "sversion=$SUS_VERSION" >> $GITHUB_OUTPUT

      - name: Add KernelSU
        id: add_KSU
        continue-on-error: true
        run: |
          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            echo "SukiSU..."
            REPO="SukiSU-Ultra/SukiSU-Ultra"
            KSUM="manager"
            EXPECTED_BRANCH="main"
          elif [ "${{ inputs.kernelsu_variant }}" == "BakaSU" ]; then
            echo "BakaSU..."
            REPO="Baka-SU/BakaSU"
            KSUM="manager"
            EXPECTED_BRANCH="main"
          elif [ "${{ inputs.kernelsu_variant }}" == "FinaSU" ]; then
            echo "FinaSU..."
            REPO="LyraVoid/FinaSU"
            KSUM="manager"
            EXPECTED_BRANCH="master"
          fi

          FILENAME="build-manager.yml"

          if [ "${{ inputs.kernelsu_variant }}" == "FinaSU" ]; then
            # FinaSU only uses official GitHub Releases:
            #   1) Manager = the APK of the latest Release (CI build artifacts are not fetched)
            #   2) Kernel = the commit the Release tag points to (build.yml checks out ksuCommit)
            # The two share the same source and value (Kbuild and the manager versionCode are both
            # 30000 + commit count); the certificate is taken straight from that Release APK, which
            # guarantees a strict match with the manager actually distributed.
            echo "Fetching the latest FinaSU Release..."
            REL_JSON=""
            for ATTEMPT in 1 2 3; do
              REL_JSON=$(curl -s --fail --max-time 30                 -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}"                 "https://api.github.com/repos/LyraVoid/FinaSU/releases/latest")                 && [ -n "$REL_JSON" ] && break
              echo "Failed to fetch Release info, retrying ($ATTEMPT/3)..."
              sleep 5
            done
            if [ -z "$REL_JSON" ]; then
              echo "::warning::Cannot fetch the latest FinaSU Release info; skipping manager and certificate alignment this time (kernel falls back to master + Release APK certificate)"
              exit 0
            fi
            REL_TAG=$(printf '%s' "$REL_JSON" | jq -r '.tag_name')
            REL_APK_URL=$(printf '%s' "$REL_JSON" | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n1)
            REL_COMMIT=$(curl -s --fail --max-time 30               -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}"               "https://api.github.com/repos/LyraVoid/FinaSU/commits/$REL_TAG" | jq -r '.sha')
            if [ -z "$REL_APK_URL" ] || [ "$REL_APK_URL" = "null" ] || [ -z "$REL_COMMIT" ] || [ "$REL_COMMIT" = "null" ]; then
              echo "::warning::Release $REL_TAG has no APK asset or its commit cannot be resolved; skipping manager and certificate alignment this time"
              exit 0
            fi
            echo "Downloading Release manager: $REL_TAG ($REL_COMMIT)"
            mkdir -p manager-artifacts
            REL_APK="manager-artifacts/$(basename "$REL_APK_URL")"
            curl -sL --fail --retry 3 --max-time 300 -o "$REL_APK" "$REL_APK_URL" || {
              echo "::warning::Failed to download the Release manager; skipping manager and certificate alignment this time"
              exit 0
            }
            CLEAN_NAME=$(basename "$REL_APK" | sed -E 's/-(arm64-v8a|armeabi-v7a|armv7|riscv64|x86_64|x86|universal)-release\.apk$/.apk/')
            MANAGER_VERSION=$(echo "$CLEAN_NAME" | grep -oE '_[0-9]+' | tail -n 1 | tr -d '_')
            if ! [[ "$MANAGER_VERSION" =~ ^[0-9]+$ ]]; then
              echo "::warning::Cannot parse the version from the Release APK file name ($(basename "$REL_APK")); skipping manager and certificate alignment this time"
              exit 0
            fi
            echo "Extracting the signing certificate from the Release manager APK..."
            CERT_INFO=$(python3 "$GITHUB_WORKSPACE/scripts/finasu_compat/extract_manager_cert.py" "$REL_APK" | head -n1)
            if [ -z "$CERT_INFO" ]; then
              echo "::warning::Could not extract the signing certificate from the Release manager APK; the kernel side will fall back to extracting it from the Release APK"
              exit 0
            fi
            CERT_SIZE=$(echo "$CERT_INFO" | awk '{print $1}')
            CERT_HASH=$(echo "$CERT_INFO" | awk '{print $2}')
            echo "Release: $REL_TAG, manager version $MANAGER_VERSION, certificate size=$CERT_SIZE sha256=$CERT_HASH"
            echo "MANAGER_VERSION=$MANAGER_VERSION" >> $GITHUB_ENV
            echo "managerVer=$MANAGER_VERSION" >> $GITHUB_OUTPUT
            echo "ksuCommit=$REL_COMMIT" >> $GITHUB_OUTPUT
            echo "managerCertSize=$CERT_SIZE" >> $GITHUB_OUTPUT
            echo "managerCertHash=$CERT_HASH" >> $GITHUB_OUTPUT
            exit 0
          fi

          get_manager_artifacts() {
            local artifacts="$1"
            if [ "${{ inputs.kernelsu_variant }}" == "BakaSU" ]; then
              printf '%s' "$artifacts" | jq -r \
                '.artifacts[] | select(.name == "Manager-release" or .name == "Spoofed-Manager-release") | "\(.name)\t\(.archive_download_url)"'
            else
              printf '%s' "$artifacts" | jq -r --arg needle "$KSUM" \
                '.artifacts[] | select((.name | ascii_downcase) | contains($needle)) | "\(.name)\t\(.archive_download_url)"'
            fi
          }

          # Modeled on BakaSU_CI: only fetch the latest uploaded (push) Manager build from the official main branch,
          # and name it by the versionCode measured from the downloaded APK file name, ensuring the package name
          # strictly matches the package contents.
          # Note: the sorting/caching of the runs-list API is unreliable on some repos (it may miss the latest
          # build), whereas the created date-filter parameter goes through a reliable query path, so we search
          # by date windows, working backwards from today
          RUNS_BASE="https://api.github.com/repos/$REPO/actions/workflows/$FILENAME/runs?status=success"
          CAND_FILE=$(mktemp)
          TODAY=$(date -u +%Y-%m-%d)

          for DAYS in 0 7 30 90 365; do
            if [ "$DAYS" -eq 0 ]; then
              FROM="$TODAY"
            else
              FROM=$(date -u -d "today - $DAYS days" +%Y-%m-%d)
            fi
            echo "Searching official $EXPECTED_BRANCH branch builds from $FROM ~ $TODAY..."
            for PAGE in 1 2 3; do
              RUNS=""
              for ATTEMPT in 1 2 3; do
                RUNS=$(curl -s --fail --max-time 30 -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  "$RUNS_BASE&created=$FROM..$TODAY&per_page=30&page=$PAGE") && [ -n "$RUNS" ] && break
                echo "Failed to query the build list, retrying ($ATTEMPT/3)..."
                RUNS=""
                sleep 3
              done
              RUN_COUNT=$(printf '%s' "$RUNS" | jq '.workflow_runs | length')
              if [ "$RUN_COUNT" -eq 0 ]; then
                break
              fi
              for INDEX in $(seq 0 $((RUN_COUNT - 1))); do
                BUILD_ID=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].id")
                HEAD_SHA=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].head_sha")
                HEAD_BRANCH=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].head_branch")
                EVENT=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].event")
                CREATED=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].created_at")
                # Claim builds uploaded from the official default branch (both push and workflow_dispatch;
                # manual triggers are often used for testing before an official upload), skipping PR / other-branch builds
                # (main for SukiSU/BakaSU, master for FinaSU)
                if [ "$HEAD_BRANCH" != "$EXPECTED_BRANCH" ] || { [ "$EVENT" != "push" ] && [ "$EVENT" != "workflow_dispatch" ]; }; then
                  echo "Skipping build $BUILD_ID ($HEAD_BRANCH/$EVENT): not an official $EXPECTED_BRANCH branch build"
                  continue
                fi
                printf '%s\t%s\t%s\n' "$CREATED" "$BUILD_ID" "$HEAD_SHA" >> "$CAND_FILE"
              done
            done
            if [ -s "$CAND_FILE" ]; then
              break
            fi
          done

          if [ ! -s "$CAND_FILE" ]; then
            rm -f "$CAND_FILE"
            echo "No Manager build uploaded from the official $EXPECTED_BRANCH branch was found."
            exit 1
          fi
          # sort -u de-duplicates (entries get collected repeatedly as the window widens), ordered by creation time descending (newest first)
          CAND_COUNT=$(sort -u -t$'\t' -k1,1r "$CAND_FILE" | wc -l)
          echo "Found $CAND_COUNT official $EXPECTED_BRANCH branch build(s); downloading one by one from the newest (version measured from the APK file name)..."

          while IFS=$'\t' read -r CREATED BUILD_ID HEAD_SHA; do
            ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/$REPO/actions/runs/$BUILD_ID/artifacts")
            CANDIDATE_LIST=$(get_manager_artifacts "$ARTIFACTS")
            if [ -z "$CANDIDATE_LIST" ]; then
              echo "Skipping build $BUILD_ID ($EXPECTED_BRANCH, $CREATED): no artifact containing '$KSUM' found"
              continue
            fi

            echo "Downloading artifacts of build $BUILD_ID ($EXPECTED_BRANCH, $CREATED, ${HEAD_SHA:0:8})..."
            rm -rf manager-artifacts
            mkdir -p manager-artifacts
            while IFS=$'\t' read -r NAME URL; do
              SAFE_NAME=$(echo "$NAME" | tr '/ ' '__')
              if ! curl -sL --fail -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -o "manager-artifacts/$SAFE_NAME.zip" "$URL"; then
                echo "Failed to download $NAME"
                continue
              fi
              mkdir -p "manager-artifacts/$SAFE_NAME"
              unzip -oq "manager-artifacts/$SAFE_NAME.zip" -d "manager-artifacts/$SAFE_NAME" || echo "Failed to extract $NAME"
              rm -f "manager-artifacts/$SAFE_NAME.zip"
            done <<< "$CANDIDATE_LIST"

            # Extract the measured versionCode from the APK file name to name the artifact
            # Prefer arm64-v8a release (BakaSU downstream only keeps this one ABI)
            APK_FILE=$(find manager-artifacts -type f -name "*-arm64-v8a-release.apk" | head -n 1)
            if [ -z "$APK_FILE" ]; then
              APK_FILE=$(find manager-artifacts -type f -name "*release.apk" ! -name "*debug*" | head -n 1)
            fi
            if [ -z "$APK_FILE" ]; then
              echo "Skipping build $BUILD_ID ($EXPECTED_BRANCH, $CREATED): no release APK in the artifact"
              continue
            fi
            # Strip the ABI segment before extracting the version, so numeric tails such as "_64" in x86_64 are not mistaken for the versionCode
            CLEAN_NAME=$(basename "$APK_FILE" | sed -E 's/-(arm64-v8a|armeabi-v7a|armv7|riscv64|x86_64|x86|universal)-release\.apk$/.apk/')
            ACTUAL_VERSION=$(echo "$CLEAN_NAME" | grep -oE '_[0-9]+' | tail -n 1 | tr -d '_')
            if ! [[ "$ACTUAL_VERSION" =~ ^[0-9]+$ ]]; then
              echo "Skipping build $BUILD_ID ($EXPECTED_BRANCH, $CREATED): cannot parse the version from the APK file name ($(basename "$APK_FILE"))"
              continue
            fi

            MANAGER_VERSION="$ACTUAL_VERSION"
            MANAGER_BUILD_ID="$BUILD_ID"
            MANAGER_HEAD_SHA="$HEAD_SHA"
            break
          done < <(sort -u -t$'\t' -k1,1r "$CAND_FILE")
          rm -f "$CAND_FILE"

          if [ -z "$MANAGER_VERSION" ]; then
            echo "Could not get the latest uploaded Manager artifact from the official $EXPECTED_BRANCH branch."
            exit 1
          fi
          echo "Selected Manager build $MANAGER_BUILD_ID ($EXPECTED_BRANCH, ${MANAGER_HEAD_SHA:0:8}), APK measured version $MANAGER_VERSION"
          # The kernel side will align to the same commit as that build (BakaSU/FinaSU: direct checkout; SukiSU: rewrite
          # the version source REPO_BRANCH), so compare against "the KSU version corresponding to that commit"
          # rather than the version at the default branch HEAD
          PIN_COUNT=$(git -C KernelSU rev-list --count "$MANAGER_HEAD_SHA" 2>/dev/null || echo "")
          if [ -n "$PIN_COUNT" ]; then
            case "${{ inputs.kernelsu_variant }}" in
              BakaSU) PINNED_KSU_VERSION=$((30700 + PIN_COUNT)) ;;
              SukiSU) PINNED_KSU_VERSION=$((40000 + PIN_COUNT - 2815)) ;;
              FinaSU) PINNED_KSU_VERSION=$((30000 + PIN_COUNT)) ;;
              *)      PINNED_KSU_VERSION="" ;;
            esac
            if [ -n "$PINNED_KSU_VERSION" ]; then
              echo "Kernel KSU version will align to official build commit ${MANAGER_HEAD_SHA:0:8}: $PINNED_KSU_VERSION"
              if [ "$MANAGER_VERSION" != "$PINNED_KSU_VERSION" ]; then
                echo "::warning::Manager measured version $MANAGER_VERSION does not match the KSU version $PINNED_KSU_VERSION of the official build commit"
              fi
            elif [ -n "${KSU_VERSION:-}" ] && [ "$MANAGER_VERSION" != "$KSU_VERSION" ]; then
              echo "::warning::Manager measured version $MANAGER_VERSION does not match the kernel KSU version ${KSU_VERSION}"
            fi
          elif [ -n "${KSU_VERSION:-}" ] && [ "$MANAGER_VERSION" != "$KSU_VERSION" ]; then
            echo "::warning::Manager measured version $MANAGER_VERSION does not match the kernel KSU version ${KSU_VERSION} (cannot compute the version for the official build commit)"
          fi
          echo "MANAGER_VERSION=$MANAGER_VERSION" >> $GITHUB_ENV
          echo "managerVer=$MANAGER_VERSION" >> $GITHUB_OUTPUT
          echo "ksuCommit=$MANAGER_HEAD_SHA" >> $GITHUB_OUTPUT

          if [ "${{ inputs.kernelsu_variant }}" == "BakaSU" ]; then
            echo "Keeping only the BakaSU arm64-v8a release manager..."
            find manager-artifacts -type f -name "*.apk" ! -name "*-arm64-v8a-release.apk" -delete
            find manager-artifacts -type f -name "*debug*.apk" -delete
            if ! find manager-artifacts -type f -name "*-arm64-v8a-release.apk" | grep -q .; then
              echo "BakaSU arm64-v8a release manager not found."
              exit 1
            fi
            find manager-artifacts -type f -name "*.apk" -print
          fi

          # FinaSU already exited early in the Release branch above and never reaches the CI artifact flow.
      - name: Add SUSFS module
        id: add_SUSFS
        continue-on-error: true
        run: |
          # The upstream susfs4ksu-module Actions artifacts have all expired;
          # the module is now published via GitHub Releases, so fetch the latest Release asset instead
          RELEASE_API="https://api.github.com/repos/sidex15/susfs4ksu-module/releases/latest"
          RELEASE_JSON=""
          for ATTEMPT in 1 2 3; do
            RELEASE_JSON=$(curl -s --fail --max-time 30 \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$RELEASE_API") \
              && [ -n "$RELEASE_JSON" ] && break
            echo "Failed to fetch Release info, retrying ($ATTEMPT/3)..."
            sleep 5
          done
          if [ -z "$RELEASE_JSON" ]; then
            echo "Cannot fetch the latest susfs4ksu-module Release info"
            exit 1
          fi

          TAG_NAME=$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')
          ASSET_URL=$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select((.name | contains("ksu_module_susfs")) and (.name | endswith(".zip"))) | .browser_download_url' | head -n 1)

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "No ksu_module_susfs module zip found in Release $TAG_NAME"
            exit 1
          fi

          NAME="ksu_module_susfs.zip"
          echo "Downloading SUSFS module: $NAME (Release $TAG_NAME)"
          if ! curl -sL --fail --retry 3 --max-time 120 -o "$NAME" "$ASSET_URL"; then
            echo "Failed to download the SUSFS module: $ASSET_URL"
            exit 1
          fi
          echo "SUSFS_NAME=$TAG_NAME" >> $GITHUB_ENV

          # The Release asset itself is the complete module zip; verify its integrity, then put it directly in the module directory
          if ! unzip -t "$NAME" >/dev/null 2>&1; then
            echo "The downloaded SUSFS module zip is corrupted"
            exit 1
          fi
          mkdir -p susfs-module
          mv "$NAME" "susfs-module/$NAME"
          ls -la susfs-module/

      - name: Notify on failure
        if: steps.add_KSU.outcome == 'failure'
        run: echo "Failed to download the CI-built KSU!"

      - name: Upload APK
        if: steps.add_KSU.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.kernelsu_variant }}-Manager(${{ env.MANAGER_VERSION }})
          path: |
            manager-artifacts/**/*.apk

      - name: Upload SUSFS module
        if: steps.add_SUSFS.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: susfs-${{ env.SUSFS_NAME }}
          path: ./susfs-module/*
