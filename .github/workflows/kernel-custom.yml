        required: false
        type: choice
        default: "auto (match latest security patch level automatically)"
        options:
          - "auto (match latest security patch level automatically)"
          - "43 (2021-08)"
          - "43 (2021-09)"
          - "43 (2021-10)"
          - "66 (2021-11)"
          - "66 (2021-12)"
          - "66 (2022-01)"
          - "81 (2022-02)"
          - "81 (2022-03)"
          - "101 (2022-04)"
          - "101 (2022-05)"
          - "110 (2022-06)"
          - "110 (2022-07)"
          - "117 (2022-08)"
          - "117 (2022-09)"
