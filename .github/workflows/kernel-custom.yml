      # ==================== KernelSU configuration ====================
      kernelsu_variant:
        description: "KernelSU variant"
        required: true
        type: choice
        options:
          - SukiSU
          - BakaSU
          - FinaSU
        default: BakaSU

      # ==================== Optional configuration ====================
      version:
        description: "Custom version name (optional)"
        required: false
        type: string
      build_time:
        description: "Custom build time (leave empty = automatically use current Beijing time) (example: Sun Dec  1 08:10:00 UTC 2026)"
        required: false
        type: string
        default: ""

      # ==================== Options ====================
      use_kpm:
        description: "KPM feature (SukiSU only)"
        required: true
        type: choice
        default: "disabled"
        options:
          - "disabled"
          - "enabled"
          - "patched (enabled and patched)"
      droidspaces:
        description: "Droidspaces container support (5.10~6.6: slot patch, 6.12: on/off)"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      artifact_upload_mode:
        description: "Build artifact upload mode"
        required: true
        type: choice
        options:
          - "AnyKernel3.zip only"
          - "Upload everything"
        default: "AnyKernel3.zip only"
      droidspaces_ntsync:
        description: "Enable NTSync support for Droidspaces containers (requires Droidspaces to be enabled)"
        required: false
        type: boolean
        default: false

      # ==================== Feature toggles ====================
      use_zram:
        description: "Enable ZRAM compression algorithm"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "Enable BBG baseband guard"
        required: true
        type: boolean
        default: false
      use_net_enhance:
        description: "Enable network enhancements (IPSet + BBR)"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "Enable Re-Kernel driver"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "Apply CVE-2026-43499 rtmutex fix chain"
        required: false
        type: boolean
        default: false
      cancel_susfs:
        description: "Disable SUSFS"
        required: true
        type: boolean
        default: false
      supp_op:
        description: "Enable OnePlus Snapdragon 8 Elite/Gen5 support"
        required: false
        type: boolean
        default: false
      skip_incompatible:
        description: "Automatically skip a feature if it is incompatible or unusable (does not abort the build)"
        required: false
        type: boolean
        default: false

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      android_version: ${{ steps.resolve.outputs.android_version }}
      sub_level: ${{ steps.resolve.outputs.sub_level }}
      kernel_full: ${{ steps.resolve.outputs.kernel_full }}
      os_patch_level: ${{ steps.resolve.outputs.os_patch_level }}
    steps:
      - name: Check out version data
        uses: actions/checkout@v7

      - name: Resolve security patch level
        id: resolve
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          SUB_LEVEL_5_10: ${{ inputs.sub_level_5_10 }}
          SUB_LEVEL_5_15: ${{ inputs.sub_level_5_15 }}
          SUB_LEVEL_6_1: ${{ inputs.sub_level_6_1 }}
          SUB_LEVEL_6_6: ${{ inputs.sub_level_6_6 }}
          SUB_LEVEL_6_12: ${{ inputs.sub_level_6_12 }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          kernel_version = os.environ["KERNEL_VERSION"]
          android_map = {
              "5.10": "android12",
              "5.15": "android13",
              "6.1": "android14",
              "6.6": "android15",
              "6.12": "android16",
          }
          android_version = android_map.get(kernel_version)
          if android_version is None:
              print(f"::error::Unsupported kernel version: {kernel_version}")
              sys.exit(1)

          data_path = Path("data") / android_version / f"{kernel_version}.json"

          if not data_path.exists():
              print(f"::error::Version data not found: {data_path}")
              sys.exit(1)

          with data_path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          # Pick the sub-level dropdown input that matches the kernel version
          sub_level_input = os.environ.get(f"SUB_LEVEL_{kernel_version.replace('.', '_')}", "").strip()

          if sub_level_input and not sub_level_input.startswith("auto"):
              # Look up the security patch level by sub-level, e.g. "138 (2025-06)" -> 2025-06
              token = sub_level_input.split()[0]
              if token == "lts":
                  kernel_full = data.get("lts")
                  if not kernel_full:
                      print(f"::error::{android_version} / {kernel_version} is missing LTS version data")
                      sys.exit(1)
                  sub_level = "X"
                  patch_level = "lts"
              elif token.isdigit():
                  matches = [
                      entry for entry in data.get("entries", [])
                      if entry.get("kernel") == f"{kernel_version}.{token}"
                  ]
                  if not matches:
                      print(f"::error::No version data found for {android_version} / {kernel_version}.{token}")
                      sys.exit(1)
                  # entries are sorted by date ascending; take the latest security patch level for this sub-level
                  latest = matches[-1]
                  kernel_full = latest.get("kernel", "")
                  patch_level = latest.get("date", "")
                  sub_level = token
              else:
                  print(f"::error::Unrecognized sub-level: {sub_level_input}")
                  sys.exit(1)
          else:
              # auto: take the latest monthly ASB entry in the version data (data is kept fresh by update_data.py)
              entries = data.get("entries", [])
              if not entries:
                  print(f"::error::No version data available for {android_version} / {kernel_version}")
                  sys.exit(1)
              latest = entries[-1]
              kernel_full = latest.get("kernel", "")
              prefix = f"{kernel_version}."
              if not kernel_full.startswith(prefix):
                  print(f"::error::Invalid version data: {kernel_full} does not belong to {kernel_version}")
                  sys.exit(1)
              patch_level = latest.get("date", "")
              sub_level = kernel_full.rsplit(".", 1)[-1]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"android_version={android_version}\n")
              output.write(f"sub_level={sub_level}\n")
              output.write(f"kernel_full={kernel_full}\n")
              output.write(f"os_patch_level={patch_level}\n")

          print(f"Resolved: {android_version} / {kernel_full} / patch level {patch_level}, sub-level: {sub_level}")
          PY

  build-custom-kernel:
    name: "${{ needs.resolve-version.outputs.kernel_full }}-${{ needs.resolve-version.outputs.android_version }}-${{ needs.resolve-version.outputs.os_patch_level }}"
    needs: [resolve-version, get-ksu-manager]
    # A failed manager fetch does not block the kernel build (if ksuCommit is empty, the kernel follows main HEAD)
    if: ${{ !cancelled() && needs.resolve-version.result == 'success' }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: ${{ needs.resolve-version.outputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      sub_level: ${{ needs.resolve-version.outputs.sub_level }}
      os_patch_level: ${{ needs.resolve-version.outputs.os_patch_level }}
      revision: "r1"
      ksu_variant: ${{ inputs.kernelsu_variant }}
      # Check out the kernel-side KernelSU at the same commit as the latest official uploaded Manager build,
      # so the kernel's KSU version strictly matches the fetched manager APK (effective for BakaSU / FinaSU)
      ksu_commit: ${{ needs.get-ksu-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ needs.get-ksu-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ needs.get-ksu-manager.outputs.managerCertHash }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ !inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}

  # First fetch the latest official uploaded Manager build and output its commit SHA, so the kernel build can align with it
  get-ksu-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
