name: Kernel Build - Android 16 (6.12)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: "KernelSU Variant"
        required: true
        type: choice
        options:
          - SukiSU
          - BakaSU
          - FinaSU
        default: BakaSU
      custom_tag:
        description: "Custom build tag/suffix (e.g., NO-Zram)"
        required: false
        type: string
        default: ""
      version:
        description: "Custom Version Name (Optional)"
        required: false
        type: string
      build_time:
        description: "Custom Build Time (Blank = Auto current Beijing time)"
        required: false
        type: string
        default: ""
      use_kpm:
        description: "KPM Feature (Supported by SukiSU only)"
        required: true
        type: choice
        default: "disabled (关闭)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补)"
      droidspaces:
        description: "Droidspaces Container Support"
        required: false
        type: choice
        options:
          - "off"
          - "on"
        default: "off"
      artifact_upload_mode:
        description: "Artifact Upload Mode"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
        default: "仅上传 AnyKernel3.zip"
      droidspaces_ntsync:
        description: "Enable Droidspaces Container NTSync Support"
        required: false
        type: boolean
        default: false
      use_zram:
        description: "Enable ZRAM Compression Algorithm"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "Enable BBG Baseband Protection"
        required: true
        type: boolean
        default: false
      use_net_enhance:
        description: "Enable Network Enhancement (IPSet + BBR)"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "Enable Re-Kernel Driver"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "Apply CVE-2026-43499 rtmutex Patch Chain"
        required: false
        type: boolean
        default: false
      cancel_susfs:
        description: "Disable SUSFS"
        required: true
        type: boolean
        default: false
      supp_op:
        description: "Enable OnePlus Snapdragon 8 Elite/Gen5 Support"
        required: false
        type: boolean
        default: false
      skip_incompatible:
        description: "Auto-skip incompatible features"
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string
      custom_tag:
        required: false
        type: string
        default: ""
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: ""
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_net_enhance:
        required: true
        type: boolean
        default: false
      use_kpm:
        required: true
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      cancel_susfs:
        required: false
        type: boolean
        default: false
      supp_op:
        required: false
        type: boolean
        default: false
      droidspaces:
        required: false
        type: string
        default: "off"
      artifact_upload_mode:
        required: false
        type: string
        default: "上传全部"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      skip_incompatible:
        required: false
        type: boolean
        default: false
      called_from_main:
        description: "Whether called from main.yml"
        required: false
        type: boolean
        default: false
      ksu_commit:
        required: false
        type: string
        default: ""
      ksu_cert_size:
        required: false
        type: string
        default: ""
      ksu_cert_hash:
        required: false
        type: string
        default: ""

jobs:
  build-kernels-a16-6-12:
    name: "6.12.${{ matrix.display_sub || matrix.sub_level }}-${{ matrix.os_patch_level }}"
    needs: get-ksu-manager
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sub_level: "38"
            os_patch_level: "2025-09"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android16"
      kernel_version: "6.12"
      sub_level: ${{ matrix.sub_level }}
      display_sub: ${{ matrix.display_sub || '' }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      custom_tag: ${{ inputs.custom_tag || '' }}
      ksu_commit: ${{ inputs.ksu_commit || needs.get-ksu-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ inputs.ksu_cert_size || needs.get-ksu-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ inputs.ksu_cert_hash || needs.get-ksu-manager.outputs.managerCertHash }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram || false }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ !inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}

  get-ksu-manager:
    if: ${{ !inputs.called_from_main }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
