# ========================================
# GKI kernel build main entry point
# ========================================
# This workflow is the project's unified entry point, used to:
# 1. Build GKI kernels for all versions
# 2. Fetch the latest KSU manager
# 3. Collect patch reject files and compile failure logs for debugging
# 4. Create a GitHub Release (optional)
# ========================================

name: Build Kernel

# Concurrency control: only one instance runs per branch; a new run cancels the old one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== Release configuration ====================
      release_type:
        description: "Release type"
        type: choice
        options:
          - Actions
          - Pre-Release
          - Release
        default: Actions

      # ==================== KernelSU configuration ====================
      kernelsu_variant:
        description: "KernelSU variant"
        type: choice
        options:
          - SukiSU
          - BakaSU
          - FinaSU
        default: BakaSU

      # ==================== Optional configuration ====================
      version:
        description: "Custom version name (optional)"
        type: string
        default: ""
        required: false
      build_time:
        description: "Custom build time (leave empty = automatically use current Beijing time) (example: Sun Dec  1 08:10:00 UTC 2026)"
        type: string
        default: ""
        required: false
      # ==================== Options ====================
      use_kpm:
        description: "KPM feature (SukiSU only)"
        type: choice
        default: "disabled"
        options:
          - "disabled"
          - "enabled"
          - "patched (enabled and patched)"
      droidspaces:
        description: "Droidspaces container support (5.10~6.6: slot patch, 6.12: on/off)"
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      droidspaces_ntsync:
        description: "Enable NTSync support for Droidspaces containers (requires Droidspaces to be enabled)"
        type: boolean
        default: false
      artifact_upload_mode:
        description: "Build artifact upload mode"
        required: true
        type: choice
        options:
          - "AnyKernel3.zip only"
          - "Upload everything"
        default: "AnyKernel3.zip only"

      # ==================== Feature toggles ====================
      use_zram:
        description: "Enable ZRAM compression algorithm"
        type: boolean
        default: false
      use_bbg:
        description: "Enable BBG baseband guard"
        type: boolean
        default: false
      use_net_enhance:
        description: "Enable network enhancements (IPSet + BBR)"
        type: boolean
        default: false
      use_rekernel:
        description: "Enable Re-Kernel driver"
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "Apply CVE-2026-43499 rtmutex fix chain"
        type: boolean
        default: false
      cancel_susfs:
        description: "Disable SUSFS"
        type: boolean
        default: false

      # ==================== Compatibility ====================
      skip_incompatible:
        description: "Automatically skip a feature if it is incompatible or unusable (does not abort the build)"
        type: boolean
        default: false

      # ==================== Build version selection ====================
      build_a12_5_10:
        description: "Android 12 - 5.10"
        type: boolean
        default: false
      build_a13_5_15:
        description: "Android 13 - 5.15"
        type: boolean
        default: false
      build_a14_6_1:
        description: "Android 14 - 6.1"
        type: boolean
        default: false
      build_a15_6_6:
        description: "Android 15 - 6.6"
        type: boolean
        default: false
      build_a16_6_12:
        description: "Android 16 - 6.12"
        type: boolean
        default: false
      build_all:
        description: "Build all versions"
        type: boolean
        default: true

jobs:
  # ==================== Get manager ====================
  # Download the latest KernelSU manager APK and SUSFS module
  get-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}

  # ==================== Android 12 - 5.10 build ====================
  build-a12-5-10:
    needs: [get-manager]
    # A failed manager fetch does not block the build (if ksuCommit is empty, the kernel follows main HEAD)
    if: ${{ !cancelled() && (inputs.build_a12_5_10 || inputs.build_all) }}
    uses: ./.github/workflows/kernel-a12-5-10.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      ksu_commit: ${{ needs.get-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ needs.get-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ needs.get-manager.outputs.managerCertHash }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}
      called_from_main: true

  # ==================== Android 13 - 5.15 build ====================
  build-a13-5-15:
    needs: [get-manager]
    # A failed manager fetch does not block the build (if ksuCommit is empty, the kernel follows main HEAD)
    if: ${{ !cancelled() && (inputs.build_a13_5_15 || inputs.build_all) }}
    uses: ./.github/workflows/kernel-a13-5-15.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      ksu_commit: ${{ needs.get-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ needs.get-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ needs.get-manager.outputs.managerCertHash }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}
      called_from_main: true

  # ==================== Android 14 - 6.1 build ====================
  build-a14-6-1:
    needs: [get-manager]
    # A failed manager fetch does not block the build (if ksuCommit is empty, the kernel follows main HEAD)
    if: ${{ !cancelled() && (inputs.build_a14_6_1 || inputs.build_all) }}
    uses: ./.github/workflows/kernel-a14-6-1.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      ksu_commit: ${{ needs.get-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ needs.get-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ needs.get-manager.outputs.managerCertHash }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}
      called_from_main: true

  # ==================== Android 15 - 6.6 build ====================
  build-a15-6-6:
    needs: [get-manager]
    # A failed manager fetch does not block the build (if ksuCommit is empty, the kernel follows main HEAD)
    if: ${{ !cancelled() && (inputs.build_a15_6_6 || inputs.build_all) }}
    uses: ./.github/workflows/kernel-a15-6-6.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      ksu_commit: ${{ needs.get-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ needs.get-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ needs.get-manager.outputs.managerCertHash }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}
      called_from_main: true

  # ==================== Android 16 - 6.12 build ====================
  build-a16-6-12:
    needs: [get-manager]
    # A failed manager fetch does not block the build (if ksuCommit is empty, the kernel follows main HEAD)
    if: ${{ !cancelled() && (inputs.build_a16_6_12 || inputs.build_all) }}
    uses: ./.github/workflows/kernel-a16-6-12.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      ksu_commit: ${{ needs.get-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ needs.get-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ needs.get-manager.outputs.managerCertHash }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}
      called_from_main: true

  # ==================== Collect patch reject files ====================
  # Aggregate the .rej files from all build jobs to make patch debugging easier
  collect-rejects:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    needs:
      - build-a12-5-10
      - build-a13-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
    steps:
      - name: Download reject files
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          pattern: '*-Rejects'

      - name: Process reject files
        run: |
          mkdir -p aio-rejects
          for dir in ./downloaded-artifacts/*-Rejects; do
            [ -d "$dir" ] || continue
            dirname=$(basename "$dir")
            original_name=${dirname%-Rejects}
            mkdir -p "aio-rejects/$original_name"
            cp -r "$dir/." "aio-rejects/$original_name/"
          done
          if [ "$(ls -A aio-rejects 2>/dev/null)" ]; then
            cd aio-rejects && zip -r -q -9 ../AIO-REJ.zip . && cd ..
          fi

      - name: Upload aggregated reject files
        uses: actions/upload-artifact@v6
        with:
          name: AIO-REJ
          path: AIO-REJ.zip
          if-no-files-found: ignore

  # ==================== Collect compile failure logs ====================
  # Aggregate all failure logs by build name, for unified download and easier problem tracking
  collect-build-logs:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    needs:
      - build-a12-5-10
      - build-a13-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
    steps:
      - name: Download compile failure logs
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-build-logs
          pattern: '*-Build-Logs'
          merge-multiple: false

      - name: Process compile failure logs
        run: |
          mkdir -p aio-build-logs
          found_logs=false
          for dir in ./downloaded-build-logs/*-Build-Logs; do
            [ -d "$dir" ] || continue
            artifact_name=$(basename "$dir")
            mkdir -p "aio-build-logs/$artifact_name"
            cp -r "$dir/." "aio-build-logs/$artifact_name/"
            found_logs=true
          done

          # When download-artifact matches only one artifact, it extracts straight into the target directory
          if [ "$found_logs" = false ] && [ -f ./downloaded-build-logs/artifact-name.txt ]; then
            read -r artifact_name < ./downloaded-build-logs/artifact-name.txt
            artifact_name=$(basename "$artifact_name")
            if [ -n "$artifact_name" ]; then
              mkdir -p "aio-build-logs/$artifact_name"
              cp -r ./downloaded-build-logs/. "aio-build-logs/$artifact_name/"
            fi
          fi

          if [ "$(ls -A aio-build-logs 2>/dev/null)" ]; then
            cd aio-build-logs
            zip -r -q -9 ../AIO-BUILD-LOGS.zip .
          fi

      - name: Upload aggregated compile failure logs
        id: upload_aggregated_build_logs
        uses: actions/upload-artifact@v6
        with:
          name: AIO-BUILD-LOGS
          path: AIO-BUILD-LOGS.zip
          if-no-files-found: ignore

      - name: Delete individual compile failure logs
        if: steps.upload_aggregated_build_logs.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # After the aggregated artifact is uploaded successfully, delete the intermediate artifacts to avoid duplicate storage
          if ! ARTIFACT_IDS=$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | endswith("-Build-Logs")) | .id'); then
            echo "::warning::Failed to get the list of individual compile failure logs, skipping cleanup"
            exit 0
          fi

          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            if gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > /dev/null; then
              echo "Deleted intermediate log artifact: $artifact_id"
            else
              echo "::warning::Failed to delete intermediate log artifact $artifact_id"
            fi
          done <<< "$ARTIFACT_IDS"

  # ==================== Create release ====================
  # When release_type is not Actions, create a GitHub Release
  # When Actions is selected as the release type, only Artifacts are uploaded and no Release is created
  release:
    if: ${{ always() && !cancelled() && inputs.release_type != 'Actions' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    needs:
      - get-manager
      - build-a12-5-10
      - build-a13-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12

    # ==================== Environment variables ====================
    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # ==================== Set display names ====================
      # Precompute the various display names to simplify later references
      - name: Set display names
        run: |
          # KSU display name
          case "${{ inputs.kernelsu_variant }}" in
            "SukiSU")    KSU_NAME="SukiSU" ;;
            "BakaSU")  KSU_NAME="BakaSU" ;;
            "FinaSU")  KSU_NAME="FinaSU" ;;
          esac
          echo "KSU_NAME=$KSU_NAME" >> $GITHUB_ENV

          # Version info (when the kernel side is aligned to the official uploaded build, the actual kernel KSU
          # version = managerVer; if managerVer is empty (manager fetch failed), fall back to ksuVer)
          KSU_VER="${{ needs.get-manager.outputs.managerVer }}"
          if [ -z "$KSU_VER" ]; then
            KSU_VER="${{ needs.get-manager.outputs.ksuVer }}"
          fi
          SUS_VER="${{ needs.get-manager.outputs.susVer }}"
          echo "KSU_VER=$KSU_VER" >> $GITHUB_ENV
          echo "SUS_VER=$SUS_VER" >> $GITHUB_ENV

          # Feature toggle display
          echo "LZ4_STATUS=${{ inputs.use_zram && 'Enabled' || 'Disabled' }}" >> $GITHUB_ENV
          echo "BBG_STATUS=${{ inputs.use_bbg && 'Enabled' || 'Disabled' }}" >> $GITHUB_ENV
          echo "NET_ENHANCE_STATUS=${{ inputs.use_net_enhance && 'Enabled' || 'Disabled' }}" >> $GITHUB_ENV
          echo "REKERNEL_STATUS=${{ inputs.use_rekernel && 'Enabled' || 'Disabled' }}" >> $GITHUB_ENV
          if [[ "${{ inputs.use_kpm }}" == enabled* ]]; then
            echo "KPM_STATUS=Enabled (unpatched)" >> $GITHUB_ENV
          elif [[ "${{ inputs.use_kpm }}" == patched* ]]; then
            echo "KPM_STATUS=Enabled (patched at build time)" >> $GITHUB_ENV
          else
            echo "KPM_STATUS=Disabled" >> $GITHUB_ENV
          fi

          # Hook type (SUSFS integration for SukiSU / BakaSU / FinaSU is all fs inline hooks)
          echo "HOOK_TYPE=SUSFS Inline Hooks" >> $GITHUB_ENV

          # Mount type (FinaSU uses the metamodule module architecture)
          if [ "${{ inputs.kernelsu_variant }}" == "FinaSU" ]; then
            echo "MOUNT_TYPE=Metamodule" >> $GITHUB_ENV
          else
            echo "MOUNT_TYPE=Magic Mount" >> $GITHUB_ENV
          fi

          # Release title
          echo "RELEASE_NAME=GKI Kernel: ${KSU_NAME} ${KSU_VER} + SUSFS ${SUS_VER}" >> $GITHUB_ENV

      # ==================== Verify build status ====================
      # Make sure all selected build jobs completed successfully
      - name: Verify build status
        run: |
          failed=0
          check_build() {
            local selected="$1" job_name="$2" result="$3"
            if [[ "$selected" == "true" && "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Selected build job $job_name failed (result: $result)"
              failed=1
            fi
          }
          check_build "${{ inputs.build_a12_5_10 || inputs.build_all }}" "build-a12-5-10" "${{ needs.build-a12-5-10.result }}"
          check_build "${{ inputs.build_a13_5_15 || inputs.build_all }}" "build-a13-5-15" "${{ needs.build-a13-5-15.result }}"
          check_build "${{ inputs.build_a14_6_1 || inputs.build_all }}" "build-a14-6-1" "${{ needs.build-a14-6-1.result }}"
          check_build "${{ inputs.build_a15_6_6 || inputs.build_all }}" "build-a15-6-6" "${{ needs.build-a15-6-6.result }}"
          check_build "${{ inputs.build_a16_6_12 || inputs.build_all }}" "build-a16-6-12" "${{ needs.build-a16-6-12.result }}"
          [[ "$failed" -ne 0 ]] && exit 1 || true

      # ==================== Check out code ====================
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # ==================== Determine KSU reference ====================
      # Determine the KernelSU upstream reference according to the actual build logic
      - name: Determine KSU reference
        run: |
          case "${{ inputs.kernelsu_variant }}" in
            "SukiSU")
              if [ "${{ inputs.cancel_susfs }}" = "true" ]; then
                BRANCH="main"
              else
                BRANCH="builtin"
              fi
              ;;
            "BakaSU") BRANCH="main" ;;
            "FinaSU") BRANCH="master" ;;
            *) echo "Error: unknown variant" >&2; exit 1 ;;
          esac
          echo "KSU_BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "BRANCH_INFO=$BRANCH" >> $GITHUB_ENV

      # ==================== Get KernelSU commit info ====================
      # Get the Git commit info of the KernelSU version currently in use
      - name: Get KernelSU commit info
        run: |
          case "${{ inputs.kernelsu_variant }}" in
            "SukiSU") REPO_URL="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"; REPO_URL2="SukiSU-Ultra/SukiSU-Ultra" ;;
            "BakaSU") REPO_URL="https://github.com/Baka-SU/BakaSU.git"; REPO_URL2="Baka-SU/BakaSU" ;;
            "FinaSU") REPO_URL="https://github.com/LyraVoid/FinaSU.git"; REPO_URL2="LyraVoid/FinaSU" ;;
          esac

          if [ "${{ inputs.kernelsu_variant }}" = "SukiSU" ] && [ -f "config/config" ]; then
            CUSTOM_ENABLED=$(grep "^custom=" config/config | cut -d'=' -f2)
            CUSTOM_COMMIT=$(grep "^sukisu=" config/config | cut -d'=' -f2)
            if [ "$CUSTOM_ENABLED" = "true" ] && [ -n "$CUSTOM_COMMIT" ]; then
              KSU_REF="$CUSTOM_COMMIT"
              KSU_URL="https://github.com/$REPO_URL2/commit/$CUSTOM_COMMIT"
              echo "BRANCH_INFO=custom" >> $GITHUB_ENV
            fi
          fi

          if [ -z "${KSU_REF:-}" ]; then
            COMMIT_HASH=$(git ls-remote $REPO_URL refs/heads/${KSU_BRANCH:-main} | awk '{ print $1 }')
            KSU_REF=$COMMIT_HASH
            KSU_URL="https://github.com/$REPO_URL2/commit/$COMMIT_HASH"
          fi

          echo "KSU_REF=$KSU_REF" >> $GITHUB_ENV
          echo "KSU_URL=$KSU_URL" >> $GITHUB_ENV

      # ==================== Get SUSFS commit info ====================
      # Get the Git commit info of SUSFS for each version
      - name: Get SUSFS commit info
        run: |
          GITLAB_OWNER="simonpunk"
          GITLAB_REPO="susfs4ksu"
          declare -A BRANCH_MAP=(
            ["gki_android12_5_10"]="gki-android12-5.10"
            ["gki_android13_5_15"]="gki-android13-5.15"
            ["gki_android14_6_1"]="gki-android14-6.1"
            ["gki_android15_6_6"]="gki-android15-6.6"
            ["gki_android16_6_12"]="gki-android16-6.12"
          )
          for var_name in "${!BRANCH_MAP[@]}"; do
            branch_name="${BRANCH_MAP[$var_name]}"
            COMMIT_HASH=$(git ls-remote https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO.git refs/heads/$branch_name | awk '{ print $1 }')
            if [[ -n "$COMMIT_HASH" ]]; then
              COMMIT_URL="https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO/-/commit/$COMMIT_HASH"
              echo "COMMIT_HASH_${var_name}=$COMMIT_HASH" >> "$GITHUB_ENV"
              echo "COMMIT_URL_${var_name}=$COMMIT_URL" >> "$GITHUB_ENV"
            fi
          done

      # ==================== Generate release notes ====================
      # Create the release notes document with detailed information
      - name: Generate release notes
        run: |
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          if [[ "$KSU_REF" =~ ^[0-9a-f]{40}$ ]]; then
            KSU_DISPLAY_REF="${KSU_REF:0:7}"
          else
            KSU_DISPLAY_REF="$KSU_REF"
          fi

          build_targets=""
          append_target() {
            local selected="$1" label="$2"
            if [[ "$selected" == "true" ]]; then
              if [[ -z "$build_targets" ]]; then
                build_targets="$label"
              else
                build_targets="$build_targets, $label"
              fi
            fi
          }
          append_target "${{ inputs.build_a12_5_10 || inputs.build_all }}" "Android 12 / 5.10"
          append_target "${{ inputs.build_a13_5_15 || inputs.build_all }}" "Android 13 / 5.15"
          append_target "${{ inputs.build_a14_6_1 || inputs.build_all }}" "Android 14 / 6.1"
          append_target "${{ inputs.build_a15_6_6 || inputs.build_all }}" "Android 15 / 6.6"
          append_target "${{ inputs.build_a16_6_12 || inputs.build_all }}" "Android 16 / 6.12"
          if [[ -z "$build_targets" ]]; then
            build_targets="None selected"
          fi

          : > susfs_commits.md
          append_susfs_commit() {
            local selected="$1" label="$2" hash="$3" url="$4"
            if [[ "$selected" == "true" && -n "$hash" && -n "$url" ]]; then
              printf -- '- %s: [`%s`](%s)\n' "$label" "${hash:0:7}" "$url" >> susfs_commits.md
            fi
          }
          append_susfs_commit "${{ inputs.build_a12_5_10 || inputs.build_all }}" "Android 12 / 5.10" "${COMMIT_HASH_gki_android12_5_10}" "${COMMIT_URL_gki_android12_5_10}"
          append_susfs_commit "${{ inputs.build_a13_5_15 || inputs.build_all }}" "Android 13 / 5.15" "${COMMIT_HASH_gki_android13_5_15}" "${COMMIT_URL_gki_android13_5_15}"
          append_susfs_commit "${{ inputs.build_a14_6_1 || inputs.build_all }}" "Android 14 / 6.1" "${COMMIT_HASH_gki_android14_6_1}" "${COMMIT_URL_gki_android14_6_1}"
          append_susfs_commit "${{ inputs.build_a15_6_6 || inputs.build_all }}" "Android 15 / 6.6" "${COMMIT_HASH_gki_android15_6_6}" "${COMMIT_URL_gki_android15_6_6}"
          append_susfs_commit "${{ inputs.build_a16_6_12 || inputs.build_all }}" "Android 16 / 6.12" "${COMMIT_HASH_gki_android16_6_12}" "${COMMIT_URL_gki_android16_6_12}"
          if [[ ! -s susfs_commits.md ]]; then
            echo "- No SUSFS commit info was obtained for this build" > susfs_commits.md
          fi

          cat > release_body.md << EOF
          ## GKI Kernel Release

          **$KSU_NAME $KSU_VER** + **SUSFS $SUS_VER**

          | Item | Value |
          |:---|:---|
          | Release type | ${{ inputs.release_type }} |
          | Release time | $BUILD_DATE |
          | Build scope | $build_targets |

          ### Build configuration

          | Item | Value |
          |:---|:---|
          | KernelSU variant | $KSU_NAME |
          | KernelSU branch | $BRANCH_INFO |
          | SUSFS | $SUS_VER |
          | Hook type | $HOOK_TYPE |
          | Mount method | $MOUNT_TYPE |
          | LTO | thin |
          | BBG baseband guard | $BBG_STATUS |
          | Network enhancement (IPSet + BBR) | $NET_ENHANCE_STATUS |
          | ZRAM / LZ4KD | $LZ4_STATUS |
          | Re-Kernel driver | $REKERNEL_STATUS |
          | KPM | $KPM_STATUS |

          ### Download instructions

          Please download the corresponding files from **Assets** below.

          | File type | Purpose |
          |:---|:---|
          | \`*_kernel-*.zip\` | AnyKernel3 kernel flashable package |
          | \`*.img\` | boot, vendor_boot and other image files |
          | \`*.apk\` | Root manager |
          | \`susfs-*.zip\` | Companion SUSFS module |

          > [!IMPORTANT]
          > Back up the stock Boot image before flashing.
          > If the device fails to boot, restore the stock image first, then extract the KernelSU log and report it.

          <details>
          <summary>After flashing</summary>

          ### Boots normally

          After installing or updating the KernelSU manager, check that root, modules and SUSFS status are normal.

          ### Fails to boot

          1. Restore the stock Boot image
          2. Extract the log using the KernelSU manager or recovery
          3. Submit it to [Issues](${{ github.server_url }}/${{ github.repository }}/issues), attaching the device model, Android version, kernel version and the flashed file name

          </details>

          <details>
          <summary>Upstream commit info</summary>

          **KernelSU**

          - $KSU_NAME: [\`$KSU_DISPLAY_REF\`]($KSU_URL)

          **SUSFS4KSU**

          $(cat susfs_commits.md)

          </details>

          ---

          Recommended module: https://github.com/sidex15/ksu_module_susfs

          For the Unicode zero-width bypass fix, please use the Xposed module: https://github.com/5ec1cff/FuseFixer
          EOF

      # ==================== Generate version tag ====================
      # Generate an incrementing release tag based on the SUSFS version
      - name: Generate version tag
        run: |
          # Get the SUSFS version; if get-manager was skipped, use a default value
          SUS_VERSION="${{ needs.get-manager.outputs.susVer }}"
          if [ -z "$SUS_VERSION" ]; then
            echo "Warning: SUSFS version not obtained, using the default version number"
            SUS_VERSION="1.0.0"
          fi

          # Query the latest full tag with retries; fall back to empty on failure
          FULL_TAG=""
          for i in 1 2 3; do
            FULL_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name' 2>/dev/null) && [ -n "$FULL_TAG" ] && break
            FULL_TAG=""
            sleep 3
          done

          if [ -n "$FULL_TAG" ] && [ "$(echo "$FULL_TAG" | sed 's/-.*//')" = "$SUS_VERSION" ]; then
            BASE_TAG="$FULL_TAG"
          else
            BASE_TAG="$SUS_VERSION-r0"
          fi

          NEW_TAG=$(echo "$BASE_TAG" | awk -F'-r' '{suffix=$2; if (!suffix) suffix=0; suffix++; printf "%s-r%d", $1, suffix}')

          # Guard against malformed tags (e.g. "-r1" when the lookup failed)
          if [[ ! "$NEW_TAG" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Tag generation was abnormal, falling back to $SUS_VERSION-r1"
            NEW_TAG="$SUS_VERSION-r1"
          fi
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "Generated tag: $NEW_TAG"

      # ==================== Download build artifacts ====================
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts

      # ==================== Create GitHub Release ====================
      - name: Create GitHub Release
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.release_type }}" == "Pre-Release" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          for i in 1 2 3; do
            if gh release view "$NEW_TAG" > /dev/null 2>&1; then
              echo "Release $NEW_TAG already exists, skipping creation"
              break
            fi
            if gh release create "$NEW_TAG" \
              --title "$RELEASE_NAME" \
              --notes-file release_body.md \
              --target "$GITHUB_SHA" \
              $PRERELEASE_FLAG; then
              break
            fi
            [ "$i" = 3 ] && exit 1
            echo "Failed to create Release, retrying in 10 seconds ($i/3)..."
            sleep 10
          done

      # ==================== Upload manager and module ====================
      - name: Upload manager and SUSFS module
        continue-on-error: true
        run: |
          echo "Preparing to upload APK and SUSFS module..."
          apk_count=$(find ./downloaded-artifacts -type f -name "*.apk" | wc -l || true)
          sus_count=$(find ./downloaded-artifacts -type f -path "./downloaded-artifacts/susfs-*/*" | wc -l || true)
          echo "APK files: ${apk_count}"
          echo "SUSFS files: ${sus_count}"
          find ./downloaded-artifacts -type f -name "*.apk" -print0 | \
          while IFS= read -r -d '' f; do
            gh release upload "$NEW_TAG" "$f" || true
          done
          find ./downloaded-artifacts -type f -path "./downloaded-artifacts/susfs-*/*" -print0 | \
          while IFS= read -r -d '' f; do
            gh release upload "$NEW_TAG" "$f" || true
          done

      # ==================== Upload kernel artifacts ====================
      - name: Upload kernel artifacts
        run: |
          # Artifacts from upload-only mode are loose flashable contents: pack them into a complete AnyKernel3
          # package and upload only the zip, to avoid same-named loose files (Image/anykernel.sh...) from
          # multiple versions colliding on the Release; in upload-everything mode (the directory already has
          # a zip + img) files are still uploaded one by one, unaffected.
          # --clobber makes same-named assets get overwritten instead of erroring when the job is re-run.
          for dir in ./downloaded-artifacts/*_kernel-*/; do
            [ -d "$dir" ] || continue
            [[ "$dir" == *-Rejects/ ]] && continue
            if ! ls "$dir"*.zip >/dev/null 2>&1; then
              (cd "$dir" && zip -r -q -9 "$(basename "$dir").zip" .)
              echo "Uploading $(basename "$dir").zip..."
              gh release upload "$NEW_TAG" "$dir/$(basename "$dir").zip" --clobber
            else
              for file in "$dir"*; do
                [ -f "$file" ] || continue
                echo "Uploading $file..."
                gh release upload "$NEW_TAG" "$file" --clobber
              done
            fi
          done

      # ==================== Build summary ====================
      - name: Build summary
        run: |
          echo "## Release created" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: $NEW_TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: ${{ inputs.release_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Link**: https://github.com/$REPO_OWNER/$REPO_NAME/releases/tag/$NEW_TAG" >> $GITHUB_STEP_SUMMARY
